<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>طلبات الزبائن</title>

  <link rel="stylesheet" href="/styles.css" />

  <style>
    .wrap { margin-top: 12px; }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; flex-wrap:wrap; margin: 10px 0 14px;
    }
    .filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .pill{
      border:1px solid #d7e2db; background:#fff; padding:8px 10px;
      border-radius:999px; cursor:pointer; font-weight:900; font-size:13px;
    }
    .pill.active{ background:#eaf5ef; border-color:#9dd3b1; }

    .search{ flex:1; min-width: 220px; display:flex; gap:8px; align-items:center; }
    .search input{
      width:100%; padding:10px 12px; border:1px solid #d7e2db;
      border-radius:12px; font-size:14px;
    }
    .hint{ color:#6a7b72; font-size:12px; margin-top:6px; line-height:1.4; }

    .countBox{
      background:#eef6ff;
      border:1px solid #b9d7ff;
      padding:10px 12px;
      border-radius:12px;
      font-weight:1000;
      margin-bottom:10px;
      text-align:center;
      color:#0b3c75;
    }

    #ordersList{
      display:grid;
      gap:12px;
      margin: 12px 0 18px;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      align-items:start;
    }

    .orderCard{
      background:#fff;
      border:1px solid #dfe7e2;
      border-radius:16px;
      padding:12px;
      box-shadow: 0 1px 10px rgba(0,0,0,.06);
      text-align:right;
      cursor: default;
    }

    .cardHead{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:10px; flex-wrap:wrap; margin-bottom:10px;
    }
    .orderTitle{ font-weight:1000; color:#0f2b1f; font-size:16px; }
    .meta{ color:#6a7b72; font-size:12px; margin-top:4px; direction:ltr; text-align:left; }

    .badge{
      padding:6px 10px; border-radius:999px; font-weight:900;
      font-size:12px; border:1px solid transparent; white-space:nowrap;
      display:inline-flex; align-items:center; gap:6px;
    }
    .b-new{ background:#fff7e6; border-color:#ffd38a; color:#7a4b00; }
    .b-delivery{ background:#fff3e6; border-color:#ffb366; color:#b35a00; }
    .b-done{ background:#eaf7ef; border-color:#a8e0be; color:#0f5a2a; }
    .b-cancel{ background:#ffecec; border-color:#ffc0c0; color:#8a1414; }
    .b-contact{ background:#f1ecff; border-color:#d2c0ff; color:#4b2b8a; }
    .b-courier{ background:#eef6ff; border-color:#b9d7ff; color:#0b3c75; }

    .rows{ display:grid; gap:8px; margin: 8px 0 12px; }
    .row{
      display:flex; justify-content:space-between; gap:10px;
      flex-wrap:wrap; font-size:14px;
    }
    .label{ color:#6a7b72; font-size:12px; }

    .val{
      font-weight:900;
      text-align:right;
      direction:rtl;
      unicode-bidi: plaintext;
      max-width: 72%;
      word-break: break-word;
      color:#111;
    }
    .valNum{
      direction:ltr;
      text-align:left;
      unicode-bidi: plaintext;
    }

    .items{ margin-top:10px; border-top:1px dashed #d7e2db; padding-top:10px; }
    .itemLine{
      display:flex; justify-content:space-between; gap:10px;
      padding:8px 0; border-bottom:1px solid #f0f3f1; font-size:14px;
    }
    .itemLine:last-child{ border-bottom:none; }
    .muted{ color:#6a7b72; font-size:12px; }

    .summary{
      margin-top:10px;
      padding:10px;
      border-radius:14px;
      background:#f6fbf8;
      border:1px solid #cfe3d6;
      display:grid;
      gap:8px;
      font-weight:1000;
    }
    .sumRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }
    .sumRow small{ font-weight:900; color:#6a7b72; }

    .cancelBox{
      margin-top:10px;
      padding:10px;
      border-radius:14px;
      background:#ffecec;
      border:1px solid #ffc0c0;
      color:#8a1414;
      font-weight:900;
      line-height:1.6;
    }
    .cancelBox small{
      display:block;
      color:#8a1414;
      opacity:.85;
      margin-bottom:4px;
      font-weight:1000;
    }

    .actions{
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
      margin-top:12px;
    }
    .btn{
      border:none; border-radius:12px; padding:10px 12px;
      cursor:pointer; font-weight:1000; font-size:13px;
      text-decoration:none; display:inline-block;
    }
    .btn:active{ transform: scale(.99); }
    .btn-green{ background:#2e8b57; color:#fff; }
    .btn-blue{ background:#2b74c7; color:#fff; }
    .btn-red{ background:#d83a3a; color:#fff; }
    .btn-light{ background:#eaf5ef; color:#0f2b1f; }

    .btn-courier{ background:#0b5bd3; color:#fff; }
    .btn-courier-off{ background:#e9f2ff; color:#0b3c75; border:1px solid #b9d7ff; }

    .statusLine{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      justify-content:space-between; margin-top:12px;
    }
    select{
      padding:10px 12px; border:1px solid #d7e2db;
      border-radius:12px; font-weight:900; background:#fff;
      min-width: 180px;
    }

    .empty{
      padding:14px; background:#fff; border:1px solid #dfe7e2;
      border-radius:14px; color:#6a7b72;
    }

   @media (max-width:700px){
  #ordersList{
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap:10px;
  }

  .orderCard{
    padding:10px;
    border-radius:14px;
  }

  .orderTitle{
    font-size:13px;
  }

  .meta{
    font-size:11px;
  }

  .badge{
    font-size:10px;
    padding:5px 8px;
  }

  .rows{
    gap:6px;
    margin:6px 0 8px;
  }

  .row{
    gap:6px;
    font-size:12px;
  }

  .label{
    font-size:10px;
  }

  .val,
  .valNum{
    max-width:100%;
    font-size:12px;
  }

  .items{
    margin-top:8px;
    padding-top:8px;
  }

  .itemLine{
    font-size:12px;
    padding:6px 0;
  }

  .muted{
    font-size:10px;
  }

  .summary{
    padding:8px;
    gap:6px;
  }

  .sumRow small{
    font-size:10px;
  }

  .actions{
    justify-content:stretch;
    gap:6px;
  }

  .btn{
    width:100%;
    text-align:center;
    font-size:11px;
    padding:8px 8px;
  }

  select{
    width:100%;
    min-width:unset;
    font-size:12px;
    padding:8px 10px;
  }

  .countBox{
    font-size:12px;
    padding:9px;
  }
}

@media (max-width:360px){
  #ordersList{
    grid-template-columns: 1fr;
  }
}
input,
select,
textarea,
button {
  font-size: 16px !important;
}
  </style>
</head>

<body style="text-align:right;">
  <header>
    <span>طلبات الزبائن</span>
    <a href="/admin/secret-admin-9347" style="color:#fff; float:left; text-decoration:none; font-size:14px;">
      الرجوع للوحة
    </a>
  </header>

  <div class="container wrap">
    <div class="topbar">
      <div class="filters">
        <button class="pill active" data-filter="all">الكل</button>
        <button class="pill" data-filter="courier">للشليح</button>
        <button class="pill" data-filter="new">جديد</button>
        <button class="pill" data-filter="contacted">تم التواصل</button>
        <button class="pill" data-filter="out_for_delivery">🚚 قيد التوصيل</button>
        <button class="pill" data-filter="done">تم التوصيل</button>
        <button class="pill" data-filter="cancelled">ملغي</button>
        <div class="filters" style="margin-top:8px;">
        <button class="pill active" data-region="all">كل المناطق</button>
        <button class="pill" data-region="الشمال">الشمال</button>
        <button class="pill" data-region="الجنوب">الجنوب</button>
        <button class="pill" data-region="حيفا">حيفا</button>
        <button class="pill" data-region="الناصرة وضواحيها">الناصرة وضواحيها</button>
        <button class="pill" data-region="المثلث">المثلث</button>
        <button class="pill" data-region="المركز">المركز</button>
        <button class="pill" data-region="الجولان / الهضبة">الجولان</button>        
        <button class="pill" data-region="منطقة 1">منطقة 1</button>
        <button class="pill" data-region="منطقة 2">منطقة 2</button>
        <button class="pill" data-region="منطقة 3">منطقة 3</button>
        <button class="pill" data-region="منطقة 4">منطقة 4</button>
        <button class="pill" data-region="منطقة 5">منطقة 5</button>
        <button class="pill" data-region="منطقة 6">منطقة 6</button>
      </div>
      </div>

      <div class="search">
        <input id="q" type="text" placeholder="ابحث بالاسم / الهاتف / البلد..." />
      </div>
    </div>

    <div class="hint">
      التوصيل مجاني فوق 300₪ — وتحت 300₪ التوصيل 30₪.
      ✅ “للشليح” يعني الطلب تم اختياره للشليح فقط.
    </div>

    <div id="ordersCountAdmin" class="countBox">عدد الطلبات: 0</div>

    <div id="ordersList">تحميل...</div>
  </div>

  <script>
    const list = document.getElementById('ordersList');
    const q = document.getElementById('q');
    const ordersCountAdmin = document.getElementById('ordersCountAdmin');

    let orders = [];
    let products = [];
    let currentFilter = 'all';
    let currentRegion = 'all';
    
    const FREE_DELIVERY_FROM = 300;
    const DELIVERY_FEE = 30;
    const DEFAULT_COUNTRY_CODE = '972';

    function esc(s){
      return String(s ?? '').replace(/[&<>"']/g, (m) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }

    function formatDate(iso){
      try{
        const d = new Date(iso);
        return d.toLocaleString('en-GB', {
          year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit', hour12:false
        });
      }catch(e){ return iso || ''; }
    }

    function statusBadge(status){
      const s = status || 'new';
      if (s === 'done') return `<span class="badge b-done">تم التوصيل</span>`;
      if (s === 'out_for_delivery') return `<span class="badge b-delivery">🚚 قيد التوصيل</span>`;
      if (s === 'contacted') return `<span class="badge b-contact">تم التواصل</span>`;
      if (s === 'cancelled') return `<span class="badge b-cancel">ملغي</span>`;
      return `<span class="badge b-new">جديد</span>`;
    }

    function courierBadge(assigned){
      return assigned ? `<span class="badge b-courier">للشليح ✅</span>` : '';
    }

    function calcSubtotal(items){
      return (items || []).reduce((sum, i) => sum + (Number(i.price)||0) * (Number(i.qty)||0), 0);
    }
    function calcDelivery(subtotal){
      return subtotal >= FREE_DELIVERY_FROM ? 0 : DELIVERY_FEE;
    }
    function calcGrandTotal(items){
  const subtotal = Math.round(calcSubtotal(items));
  const delivery = calcDelivery(subtotal);
  const total = Math.round(subtotal + delivery);
  return { subtotal, delivery, total };
}

    function normalizeOrder(o){
      let items = o.items;
      if (typeof items === 'string'){
        try{ items = JSON.parse(items); } catch(e){ items = []; }
      }
      return {
        ...o,
        items: Array.isArray(items) ? items : [],
        assignedToCourier: Number(o.assignedToCourier || 0),
        cancelReason: o.cancelReason || '',
        notes: o.notes || '',
        deliveryRegion: o.deliveryRegion || ''
      };
    }

    function normalizePhoneToE164(phone){
      let digits = String(phone || '').replace(/\D/g,'');
      if (!digits) return '';
      if (digits.startsWith('00')) digits = digits.slice(2);
      if (digits.startsWith(DEFAULT_COUNTRY_CODE)) return digits;
      if (digits.startsWith('0')) return DEFAULT_COUNTRY_CODE + digits.slice(1);
      if (digits.length >= 8 && digits.length <= 10) return DEFAULT_COUNTRY_CODE + digits;
      return digits;
    }

    function buildWhatsappText(order){
      const items = (order.items || []).map(i =>
        `- ${i.name} — ${i.qty} ${i.unitType === 'bag' ? 'كيس' : 'كغم'} — ₪${(Number(i.price)||0) * (Number(i.qty)||0)}`
      ).join('\n');

      const { subtotal, delivery, total } = calcGrandTotal(order.items || []);
      const deliveryText = delivery === 0 ? 'توصيل مجاني ✅' : `₪${delivery}`;

      return `مرحبا ${order.name || ''} 👋
        تم تلقي طلبك بنجاح ✅
        تفاصيل الطلب (#${order.id}):
        
        ${items || '- (لا يوجد منتجات)'}
        
        المجموع قبل التوصيل: ₪${subtotal}
        تكلفة التوصيل: ${deliveryText}
        المجموع الكلي للدفع: ₪${total}
        
        يرجى إرسال مَوقع (Location) على واتساب لتأكيد وتجهيز الطلب ✅`;
            }

    function makeWhatsAppLink(phoneE164, text){
      const msg = encodeURIComponent(text || '');
      return `https://wa.me/${phoneE164}?text=${msg}`;
    }

    async function fetchOrders(){
  list.innerHTML = 'تحميل...';
  try{
    const [ordersRes, productsRes] = await Promise.all([
      fetch('/api/orders', { credentials:'include' }),
      fetch('/api/products', { credentials:'include' })
    ]);

    if (!ordersRes.ok){
      if (ordersRes.status === 401){ window.location.href = '/login.html'; return; }
      list.innerHTML = `<div class="empty">خطأ في تحميل الطلبات.</div>`;
      return;
    }

    const ordersData = await ordersRes.json();
    const productsData = productsRes.ok ? await productsRes.json() : [];

    orders = (ordersData || []).map(normalizeOrder);
    products = Array.isArray(productsData) ? productsData : [];

    render();
  }catch(err){
    console.error(err);
    list.innerHTML = `<div class="empty">مشكلة اتصال بالسيرفر.</div>`;
  }
}

    function matchesSearch(order, text){
      if (!text) return true;
      const t = text.toLowerCase();
      const hay = `${order.name||''} ${order.phone||''} ${order.country||''} ${order.address||''}`.toLowerCase();
      return hay.includes(t);
    }

    function matchesFilter(order){
  const statusOk =
    currentFilter === 'all' ||
    (currentFilter === 'courier' && Number(order.assignedToCourier || 0) === 1) ||
    (order.status || 'new') === currentFilter;

  const orderRegion = String(order.deliveryRegion || '').trim();

const regionOk =
  currentRegion === 'all' ||
  orderRegion === currentRegion ||
  (currentRegion === 'حيفا' && orderRegion.includes('حيفا')) ||
  (currentRegion === 'الناصرة وضواحيها' && (
    orderRegion.includes('الناصرة') ||
    orderRegion.includes('الناصره')
  ));

  return statusOk && regionOk;
}

    function render(){
      const text = q.value.trim();
      const filtered = orders
        .filter(o => matchesFilter(o))
        .filter(o => matchesSearch(o, text))
        .sort((a,b) => (b.id||0) - (a.id||0));

      ordersCountAdmin.textContent = `عدد الطلبات: ${filtered.length}`;

      if (!filtered.length){
        list.innerHTML = `<div class="empty">لا توجد طلبات بهذه الفلترة.</div>`;
        return;
      }

      list.innerHTML = filtered.map(o => {
        const { subtotal, delivery, total } = calcGrandTotal(o.items || []);
        const phoneE164 = normalizePhoneToE164(o.phone || '');
        const waLink = phoneE164 ? makeWhatsAppLink(phoneE164, buildWhatsappText(o)) : null;

        const itemsHtml = (o.items || []).map(it => {
          const unit = it.unitType === 'bag' ? 'كيس' : 'كغم';
          const line = Math.round((Number(it.price)||0) * (Number(it.qty)||0));
          return `
            <div class="itemLine">
              <div>
                <strong>${esc(it.name)}</strong>
                <div class="muted">${esc(it.qty)} ${unit} × ₪${esc(it.price)}</div>
              </div>
              <div style="font-weight:1000;" class="valNum">₪${esc(line)}</div>
            </div>
          `;
        }).join('');

        const isAssigned = Number(o.assignedToCourier || 0) === 1;

        const cancelHtml = (o.status === 'cancelled' && (o.cancelReason || '').trim())
          ? `<div class="cancelBox"><small>سبب الإلغاء</small>${esc(o.cancelReason)}</div>`
          : '';

        return `
          <div class="orderCard">
            <div class="cardHead">
              <div>
                <div class="orderTitle">طلب رقم #${esc(o.id)}</div>
                <div class="meta">${formatDate(o.createdAt)}</div>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                ${courierBadge(isAssigned)}
                ${statusBadge(o.status)}
              </div>
            </div>

            <div class="rows">
              <div class="row"><div class="label">الاسم</div><div class="val">${esc(o.name || '-')}</div></div>
              <div class="row"><div class="label">الهاتف</div><div class="val valNum">${esc(o.phone || '-')}</div></div>
              ${o.phone2 ? `
                <div class="row">
                  <div class="label">هاتف إضافي</div>
                  <div class="val valNum">${esc(o.phone2)}</div>
                </div>
              ` : ''}
              <div class="row"><div class="label">البلد</div><div class="val">${esc(o.country || '-')}</div></div>
              <div class="row"><div class="label">العنوان</div><div class="val">${esc(o.address || '-')}</div></div>
              <div class="row"><div class="label">المنطقة</div><div class="val">${esc(o.deliveryRegion || '-')}</div></div>
              <div class="row"><div class="label">ملاحظات</div><div class="val">${esc(o.notes || '-')}</div></div>
            </div>

            ${cancelHtml}

            <div class="items">
              <div style="font-weight:1000; margin-bottom:8px;">المنتجات</div>
              ${itemsHtml || '<div class="muted">لا يوجد منتجات</div>'}
            </div>

            <div class="summary">
              <div class="sumRow"><small>المجموع قبل التوصيل</small><div class="val valNum">₪${esc(subtotal)}</div></div>
              <div class="sumRow"><small>التوصيل</small><div class="val valNum">${delivery === 0 ? 'مجاني ✅' : '₪' + esc(delivery)}</div></div>
              <div class="sumRow" style="border-top:1px dashed #cfe3d6; padding-top:8px;">
                <small>المجموع الكلي</small><div class="val valNum">₪${esc(total)}</div>
              </div>
            </div>

            <div class="statusLine">
              <div style="font-weight:1000;">تغيير الحالة</div>
              <select onchange="updateStatus(${esc(o.id)}, this.value)">
                <option value="new" ${(o.status||'new')==='new' ? 'selected':''}>جديد</option>
                <option value="contacted" ${(o.status||'new')==='contacted' ? 'selected':''}>تم التواصل</option>
                <option value="out_for_delivery" ${(o.status||'new')==='out_for_delivery' ? 'selected':''}>🚚 قيد التوصيل</option>
                <option value="done" ${(o.status||'new')==='done' ? 'selected':''}>تم التوصيل</option>
                <option value="cancelled" ${(o.status||'new')==='cancelled' ? 'selected':''}>ملغي</option>
              </select>
            </div>

            <div class="statusLine">
                <div style="font-weight:1000;">تغيير المنطقة</div>
                <select onchange="updateRegion(${esc(o.id)}, this.value)">
                  <option value="" ${(o.deliveryRegion||'')==='' ? 'selected':''}>بدون منطقة</option>
                  <option value="الشمال" ${(o.deliveryRegion||'')==='الشمال' ? 'selected':''}>الشمال</option>
                  <option value="الجنوب" ${(o.deliveryRegion||'')==='الجنوب' ? 'selected':''}>الجنوب</option>
                  <option value="حيفا" ${(o.deliveryRegion||'')==='حيفا' ? 'selected':''}>حيفا</option>
                  <option value="الناصرة وضواحيها" ${(o.deliveryRegion||'')==='الناصرة وضواحيها' ? 'selected':''}>الناصرة وضواحيها</option>
                  <option value="المثلث" ${(o.deliveryRegion||'')==='المثلث' ? 'selected':''}>المثلث</option>
                  <option value="المركز" ${(o.deliveryRegion||'')==='المركز' ? 'selected':''}>المركز</option>
                  <option value="الجولان" ${(o.deliveryRegion||'')==='الجولان' ? 'selected':''}>الجولان</option>
                  <option value="منطقة 1" ${(o.deliveryRegion||'')==='منطقة 1' ? 'selected':''}>منطقة 1</option>
                  <option value="منطقة 2" ${(o.deliveryRegion||'')==='منطقة 2' ? 'selected':''}>منطقة 2</option>
                  <option value="منطقة 3" ${(o.deliveryRegion||'')==='منطقة 3' ? 'selected':''}>منطقة 3</option>
                  <option value="منطقة 4" ${(o.deliveryRegion||'')==='منطقة 4' ? 'selected':''}>منطقة 4</option>
                  <option value="منطقة 5" ${(o.deliveryRegion||'')==='منطقة 5' ? 'selected':''}>منطقة 5</option>
                  <option value="منطقة 6" ${(o.deliveryRegion||'')==='منطقة 6' ? 'selected':''}>منطقة 6</option>
                </select>
              </div>
            <div class="actions">
              ${
                waLink
                ? `<a class="btn btn-green" rel="noopener" target="_blank" href="${waLink}">واتساب</a>
                   <button class="btn btn-blue" type="button" onclick="contactAndOpen(${esc(o.id)}, '${waLink.replace(/'/g,"\\'")}')">تم التواصل + واتساب</button>`
                : `<button class="btn btn-light" type="button" disabled>لا يوجد رقم واتساب</button>`
              }

              <button
                class="btn ${isAssigned ? 'btn-courier-off' : 'btn-courier'}"
                type="button"
                onclick="toggleCourier(${esc(o.id)}, ${isAssigned ? 'true' : 'false'})">
                ${isAssigned ? 'إزالة من الشليح' : 'إرسال للشليح'}
              </button>

              <button class="btn btn-blue" type="button" onclick="editOrder(${esc(o.id)})">✏️ تعديل الطلب</button>
              <button class="btn btn-red" type="button" onclick="deleteOrder(${esc(o.id)})">حذف الطلب</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

    document.querySelectorAll('[data-region]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      render();
    });
  });
    q.addEventListener('input', () => render());

    window.updateStatus = async function(id, status){
      const prev = orders.find(o => o.id == id);
      const oldStatus = prev ? (prev.status || 'new') : 'new';

      let cancelReason = '';
      if (status === 'cancelled'){
        cancelReason = (prompt('ليش انلغى الطلب؟ اكتب سبب الإلغاء:') || '').trim();
        if (!cancelReason){
          alert('لازم تكتب سبب الإلغاء');
          render();
          return;
        }
      }

      try{
        const res = await fetch(`/api/orders/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type':'application/json' },
          credentials:'include',
          body: JSON.stringify({ status, cancelReason: status === 'cancelled' ? cancelReason : '' })
        });

        if (!res.ok){
          if (res.status === 401){ window.location.href = '/login.html'; return; }
          alert('فشل تغيير الحالة');
          if (prev) prev.status = oldStatus;
          render();
          return;
        }

        const idx = orders.findIndex(o => o.id == id);
        if (idx >= 0){
          orders[idx].status = status;
          orders[idx].cancelReason = (status === 'cancelled') ? cancelReason : '';
        }
        render();
      }catch(err){
        console.error(err);
        alert('مشكلة اتصال بالسيرفر');
        if (prev) prev.status = oldStatus;
        render();
      }
    };

    window.contactAndOpen = async function(id, waLink){
      await window.updateStatus(id, 'contacted');
      window.location.href = waLink;
    };

    window.toggleCourier = async function(id, isAssignedNow){
      const newVal = !isAssignedNow;
      try{
        const res = await fetch(`/api/orders/${id}/assign`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({ assigned: newVal })
        });

        const data = await res.json().catch(()=>({}));
        if (!res.ok){
          if (res.status === 401){ window.location.href = '/login.html'; return; }
          alert(data?.error || 'فشل إرسال الطلب للشليح');
          return;
        }

        const idx = orders.findIndex(o => o.id == id);
        if (idx >= 0){
          orders[idx].assignedToCourier = newVal ? 1 : 0;
          if (newVal) orders[idx].status = 'out_for_delivery';
        }

        render();
      }catch(err){
        console.error(err);
        alert('مشكلة اتصال بالسيرفر');
      }
    };

    window.deleteOrder = async function(id){
      if (!confirm('متأكد بدك تحذف الطلب؟')) return;

      try{
        const res = await fetch(`/api/orders/${id}`, { method:'DELETE', credentials:'include' });

        if (!res.ok){
          if (res.status === 401){ window.location.href = '/login.html'; return; }
          alert('فشل حذف الطلب');
          return;
        }

        orders = orders.filter(o => o.id != id);
        render();
      }catch(err){
        console.error(err);
        alert('مشكلة اتصال بالسيرفر');
      }
    };
    window.updateRegion = async function(id, deliveryRegion){
  try{
    const res = await fetch(`/api/orders/${id}/region`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body: JSON.stringify({ deliveryRegion })
    });

    if (!res.ok){
      if (res.status === 401){ window.location.href = '/login.html'; return; }
      alert('فشل تغيير المنطقة');
      return;
    }

    const idx = orders.findIndex(o => o.id == id);
    if (idx >= 0) orders[idx].deliveryRegion = deliveryRegion;

    render();
  }catch(err){
    console.error(err);
    alert('مشكلة اتصال بالسيرفر');
  }
};
    window.editOrder = function(id){
  const o = orders.find(x => x.id == id);
  if (!o) return alert('الطلب غير موجود');

  const card = document.querySelector(`button[onclick="editOrder(${id})"]`).closest('.orderCard');

  const itemsRows = (o.items || []).map((it, i) => `
    <div class="editItem" style="border:1px solid #d7e2db;border-radius:12px;padding:8px;margin:8px 0;">
      <input data-k="name" data-i="${i}" value="${esc(it.name)}" placeholder="اسم المنتج" style="width:100%;padding:8px;margin-bottom:6px;">
      <div style="display:flex;gap:6px;">
        <input data-k="qty" data-i="${i}" type="number" step="0.5" value="${esc(it.qty)}" placeholder="كمية" style="width:33%;padding:8px;">
        <input data-k="price" data-i="${i}" type="number" step="0.5" value="${esc(it.price)}" placeholder="سعر" style="width:33%;padding:8px;">
        <select data-k="unitType" data-i="${i}" style="width:34%;padding:8px;min-width:unset;">
          <option value="kg" ${it.unitType !== 'bag' ? 'selected' : ''}>كغم</option>
          <option value="bag" ${it.unitType === 'bag' ? 'selected' : ''}>كيس</option>
        </select>
      </div>
      <button class="btn btn-red" type="button" onclick="this.closest('.editItem').remove()">حذف المنتج</button>
    </div>
  `).join('');

  card.innerHTML += `
    <div id="editBox_${id}" style="margin-top:12px;border:2px solid #2b74c7;border-radius:16px;padding:12px;background:#f7fbff;">
      <h3 style="margin:0 0 10px;">تعديل الطلب #${id}</h3>
      <input id="e_phone2_${id}" value="${esc(o.phone2 || '')}" placeholder="هاتف إضافي" style="width:100%;padding:10px;margin:5px 0;">
      <input id="e_name_${id}" value="${esc(o.name)}" placeholder="الاسم" style="width:100%;padding:10px;margin:5px 0;">
      <input id="e_phone_${id}" value="${esc(o.phone)}" placeholder="" style="width:100%;padding:10px;margin:5px 0;">
      <input id="e_country_${id}" value="${esc(o.country)}" placeholder="البلد" style="width:100%;padding:10px;margin:5px 0;">
      <input id="e_address_${id}" value="${esc(o.address)}" placeholder="العنوان" style="width:100%;padding:10px;margin:5px 0;">
      <select id="e_region_${id}" style="width:100%;padding:10px;margin:5px 0;">
      <option value="" ${(o.deliveryRegion||'')==='' ? 'selected' : ''}>بدون منطقة</option>
      <option value="الشمال" ${(o.deliveryRegion||'')==='الشمال' ? 'selected' : ''}>الشمال</option>
      <option value="حيفا" ${(o.deliveryRegion||'')==='حيفا' ? 'selected' : ''}>حيفا</option>
      <option value="الناصرة وضواحيها" ${(o.deliveryRegion||'')==='الناصرة وضواحيها' ? 'selected' : ''}>الناصرة وضواحيها</option>
      <option value="الجنوب" ${(o.deliveryRegion||'')==='الجنوب' ? 'selected' : ''}>الجنوب</option>
      <option value="المثلث" ${(o.deliveryRegion||'')==='المثلث' ? 'selected' : ''}>المثلث</option>
      <option value="المركز" ${(o.deliveryRegion||'')==='المركز' ? 'selected' : ''}>المركز</option>
      <option value="الجولان / الهضبة" ${(o.deliveryRegion||'')==='الجولان / الهضبة' ? 'selected' : ''}>الجولان / الهضبة</option>
    </select>
      <textarea id="e_notes_${id}" placeholder="ملاحظات" style="width:100%;padding:10px;margin:5px 0;min-height:70px;">${esc(o.notes)}</textarea>

      <div style="font-weight:1000;margin-top:10px;">المنتجات</div>
      <div id="editItems_${id}">${itemsRows}</div>

      <button class="btn btn-light" type="button" onclick="addEditItem(${id})">➕ إضافة منتج</button>

      <div class="actions">
        <button class="btn btn-green" type="button" onclick="saveEditOrder(${id})">💾 حفظ التعديل</button>
        <button class="btn btn-red" type="button" onclick="document.getElementById('editBox_${id}').remove()">إلغاء</button>
      </div>
    </div>
  `;
};

window.addEditItem = function(id){
  const productOptions = products.map(p => `
    <option
      value="${esc(p.id)}"
      data-name="${esc(p.name)}"
      data-price="${esc(p.price)}"
      data-unit="${esc(p.unitType || 'kg')}"
    >
      ${esc(p.name)} — ₪${esc(p.price)} / ${p.unitType === 'bag' ? 'كيس' : 'كغم'}
    </option>
  `).join('');

  document.getElementById(`editItems_${id}`).insertAdjacentHTML('beforeend', `
    <div class="editItem" style="border:1px solid #d7e2db;border-radius:12px;padding:8px;margin:8px 0;">
      <select onchange="fillEditProduct(this)" style="width:100%;padding:8px;margin-bottom:6px;">
        <option value="">اختر منتج من القائمة</option>
        ${productOptions}
      </select>

      <input data-k="name" value="" placeholder="اسم المنتج" style="width:100%;padding:8px;margin-bottom:6px;">

      <div style="display:flex;gap:6px;">
        <input data-k="qty" type="number" step="0.5" value="1" placeholder="كمية" style="width:33%;padding:8px;">
        <input data-k="price" type="number" step="0.5" value="0" placeholder="سعر" style="width:33%;padding:8px;">
        <select data-k="unitType" style="width:34%;padding:8px;min-width:unset;">
          <option value="kg">كغم</option>
          <option value="bag">كيس</option>
        </select>
      </div>

      <button class="btn btn-red" type="button" onclick="this.closest('.editItem').remove()">حذف المنتج</button>
    </div>
  `);
};
    window.fillEditProduct = function(sel){
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;

  const row = sel.closest('.editItem');

  row.querySelector('[data-k="name"]').value = opt.dataset.name || '';
  row.querySelector('[data-k="price"]').value = opt.dataset.price || 0;
  row.querySelector('[data-k="unitType"]').value = opt.dataset.unit || 'kg';
  row.querySelector('[data-k="qty"]').value = 1;
};

window.saveEditOrder = async function(id){
  const old = orders.find(o => o.id == id);

  const items = Array.from(document.querySelectorAll(`#editItems_${id} .editItem`)).map(row => ({
    name: row.querySelector('[data-k="name"]').value.trim(),
    qty: Number(row.querySelector('[data-k="qty"]').value) || 0,
    price: Number(row.querySelector('[data-k="price"]').value) || 0,
    unitType: row.querySelector('[data-k="unitType"]').value === 'bag' ? 'bag' : 'kg'
  })).filter(i => i.name && i.qty > 0);

  const payload = {
    name: document.getElementById(`e_name_${id}`).value.trim(),
    phone: document.getElementById(`e_phone_${id}`).value.trim(),
    phone2: document.getElementById(`e_phone2_${id}`).value.trim(),
    country: document.getElementById(`e_country_${id}`).value.trim(),
    address: document.getElementById(`e_address_${id}`).value.trim(),
    notes: document.getElementById(`e_notes_${id}`).value.trim(),
    deliveryRegion: document.getElementById(`e_region_${id}`).value,
    items
  };

  const res = await fetch(`/api/orders/${id}/edit`, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body: JSON.stringify(payload)
  });

  if (!res.ok){
    alert('فشل حفظ التعديل');
    return;
  }

  await fetchOrders();
  alert('تم حفظ التعديل ✅');
};
    fetchOrders();
  </script>
</body>
