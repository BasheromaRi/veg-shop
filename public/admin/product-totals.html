<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إحصائيات المنتجات</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .box{background:#fff;border:1px solid #dfe7e2;border-radius:16px;padding:12px;margin-top:12px;box-shadow:0 1px 10px rgba(0,0,0,.06)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .pills{display:flex;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid #d7e2db;background:#fff;padding:10px 12px;border-radius:999px;font-weight:900;cursor:pointer;font-size:13px}
    .pill.active{background:#eaf5ef;border-color:#9dd3b1}
    .grid{display:grid;gap:10px;margin-top:12px}
    .item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f6fbf8;border:1px solid #cfe3d6;border-radius:14px;padding:10px}
    .name{font-weight:1000}
    .qty{font-weight:1000;direction:ltr}
    .muted{color:#6a7b72;font-size:12px}
  </style>
</head>

<body style="text-align:right;">
  <header>
    <span>إحصائيات المنتجات</span>
    <a href="/admin/secret-admin-9347" style="color:#fff; float:left; text-decoration:none; font-size:14px;">رجوع</a>
  </header>

  <div class="container">
    <div class="box">
      <div style="font-weight:1000; margin-bottom:8px;">اختار حالة الطلب</div>
      <div class="pills">
        <button class="pill active" data-s="all">الكل</button>
        <button class="pill" data-s="new">جديد</button>
        <button class="pill" data-s="contacted">تم التواصل</button>
        <button class="pill" data-s="out_for_delivery">قيد التوصيل</button>
        <button class="pill" data-s="done">تم التوصيل</button>
        <button class="pill" data-s="cancelled">ملغي</button>
      </div>

      <div style="font-weight:1000; margin:14px 0 8px;">اختار المنطقة</div>
      <div class="pills">
        <button class="pill active" data-r="all">كل المناطق</button>
        <button class="pill" data-r="الشمال">الشمال</button>
        <button class="pill" data-r="الجنوب">الجنوب</button>
        <button class="pill" data-r="المثلث">المثلث</button>
        <button class="pill" data-r="المركز">المركز</button>
        <button class="pill" data-r="الجولان / الهضبة">الجولان / الهضبة</button>
        <button class="pill" data-r="منطقة 1">منطقة 1</button>
        <button class="pill" data-r="منطقة 2">منطقة 2</button>
        <button class="pill" data-r="منطقة 3">منطقة 3</button>
        <button class="pill" data-r="منطقة 4">منطقة 4</button>
        <button class="pill" data-r="منطقة 5">منطقة 5</button>
        <button class="pill" data-r="منطقة 6">منطقة 6</button>
      </div>

      <div class="muted" style="margin-top:8px;">
        النتيجة بتعرض مجموع الكميات حسب الحالة والمنطقة.
      </div>
    </div>

    <div id="list" class="grid">تحميل...</div>
  </div>

  <script>
    const list = document.getElementById('list');
    let currentStatus = 'all';
    let currentRegion = 'all';

    function unitLabel(u){ return (u === 'bag') ? 'كيس' : 'كغم'; }

    async function loadTotals(){
      list.textContent = 'تحميل...';

      try{
        const url = `/api/reports/totals?status=${encodeURIComponent(currentStatus)}&region=${encodeURIComponent(currentRegion)}`;

        const res = await fetch(url, { credentials:'include' });

        if(!res.ok){
          if(res.status===401){ window.location.href='/login.html'; return; }
          list.textContent = 'خطأ في تحميل الإحصائيات';
          return;
        }

        const data = await res.json().catch(()=>({}));
        const totals = data.totals || [];

        if(!totals.length){
          list.textContent = 'لا توجد بيانات لهذه الحالة والمنطقة.';
          return;
        }

        list.innerHTML = totals.map(t => `
          <div class="item">
            <div>
              <div class="name">${t.name}</div>
              <div class="muted">${unitLabel(t.unitType)}</div>
            </div>
            <div class="qty">${Math.floor(Number(t.totalQty || 0))} ${unitLabel(t.unitType)}</div>
          </div>
        `).join('');

      }catch(e){
        console.error(e);
        list.textContent = 'مشكلة اتصال بالسيرفر';
      }
    }

    document.querySelectorAll('[data-s]').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        currentStatus = b.dataset.s;
        loadTotals();
      });
    });

    document.querySelectorAll('[data-r]').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        currentRegion = b.dataset.r;
        loadTotals();
      });
    });

    loadTotals();
  </script>
</body>
</html>
